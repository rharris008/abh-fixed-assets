name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push index.html to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save index.html from main BEFORE switching branches
          cp index.html /tmp/deploy_index.html
          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/deploy_index.html index.html
          git add index.html
          git diff --cached --quiet && echo "No changes to deploy" || git commit -m "Deploy from main [skip ci]"
          git push origin gh-pages
